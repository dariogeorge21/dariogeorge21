
name: WakaTime README Stats

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-readme-update
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update WakaTime Statistics
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Initialize workflow
        run: |
          echo "======================================"
          echo " WakaTime README Update"
          echo "======================================"
          echo "Trigger: ${{ github.event_name }}"
          echo "Started: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Repository: ${{ github.repository }}"
          echo "======================================"

      - name: Validate secrets
        id: validate
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          missing=0

          if [ -z "$WAKATIME_API_KEY" ]; then
            echo "::error::WAKATIME_API_KEY secret is missing."
            missing=1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_TOKEN secret is missing."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Secret validation failed."
            exit 1
          fi

          echo "All required secrets are configured."

      - name: Update WakaTime section
        id: waka
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Report update failure
        if: failure() && steps.waka.outcome == 'failure'
        run: |
          echo "::error::WakaTime README update failed."
          echo "Possible causes:"
          echo "- Invalid or expired WakaTime API key."
          echo "- WakaTime API returned HTTP 403/429."
          echo "- GitHub token lacks repository write permissions."
          echo "- Upstream action encountered an unexpected error."
          echo "Check the Update WakaTime section step logs."

      - name: Generate execution summary
        if: always()
        env:
          WAKA_STATUS: ${{ steps.waka.outcome }}
          VALIDATION_STATUS: ${{ steps.validate.outcome }}
        run: |
          {
            echo "## WakaTime README Update"
            echo ""
            echo "| Property | Status |"
            echo "|---|---|"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Secret validation | ${VALIDATION_STATUS:-not run} |"
            echo "| WakaTime update | ${WAKA_STATUS:-not run} |"
            echo "| Completed | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WAKA_STATUS" = "success" ]; then
            echo "WakaTime statistics updated successfully."
          elif [ "$WAKA_STATUS" = "failure" ]; then
            echo "::warning::WakaTime statistics were not updated."
          else
            echo "::notice::WakaTime update was not executed."
          fi
