name: WakaTime Readme Stats

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Update WakaTime section
        id: waka
        continue-on-error: false
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Warn when WakaTime update fails
        if: steps.waka.outcome == 'failure'
        run: echo "::warning::WakaTime API request failed (for example 403). Skipping README update for this run."
